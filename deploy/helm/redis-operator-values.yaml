# Namespace-scoped OT-CONTAINER-KIT Redis Operator configuration.
# Install this as a separate Helm release named redis-operator in hyeboard.
# The CRDs remain cluster-scoped prerequisites and are not owned by the
# Hyeboard application chart.
rbac:
  scope: namespace

redisOperator:
  watchNamespace: hyeboard
  imageTag: v0.26.0
  initContainerImageTag: v0.26.0

featureGates:
  GenerateConfigInInitContainer: true
