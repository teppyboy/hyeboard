apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hyeboard.apiName" . }}
  labels:
    {{- include "hyeboard.labels" . | nindent 4 }}
    {{- include "hyeboard.apiSelectorLabels" . | nindent 4 }}
    {{- include "hyeboard.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: {{ .Values.api.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.api.minReadySeconds }}
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "hyeboard.apiSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hyeboard.labels" . | nindent 8 }}
        {{- include "hyeboard.apiSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "hyeboard.apiServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "hyeboard.image" (dict "image" .Values.images.api) }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "hyeboard.fullname" . }}-runtime
          env:
            - name: HYEB_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyeboard.secretName" . }}
                  key: {{ .Values.secrets.keys.sessionSecret }}
            - name: HYEB_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyeboard.secretName" . }}
                  key: {{ .Values.secrets.keys.postgresUrl }}
            - name: HYEB_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyeboard.secretName" . }}
                  key: {{ .Values.secrets.keys.redisUrl }}
            - name: AUTOMATION_KEY_CURRENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyeboard.secretName" . }}
                  key: {{ .Values.secrets.keys.automationCurrentId }}
            - name: AUTOMATION_KEY_CURRENT_B64
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyeboard.secretName" . }}
                  key: {{ .Values.secrets.keys.automationCurrentB64 }}
            - name: AUTOMATION_KEY_PREVIOUS_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyeboard.secretName" . }}
                  key: {{ .Values.secrets.keys.automationPreviousId }}
                  optional: true
            - name: AUTOMATION_KEY_PREVIOUS_B64
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyeboard.secretName" . }}
                  key: {{ .Values.secrets.keys.automationPreviousB64 }}
                  optional: true
            - name: HYEB_HA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            {{- toYaml .Values.api.probes.readiness | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.probes.liveness | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.api.probes.startup | nindent 12 }}
          lifecycle:
            {{- toYaml .Values.api.lifecycle | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            {{- toYaml .Values.api.tmpVolume | nindent 12 }}
