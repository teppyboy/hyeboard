{{- if .Values.browserless.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hyeboard.browserlessName" . }}
  labels:
    {{- include "hyeboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "hyeboard.browserlessName" . }}
    app.kubernetes.io/component: browserless
    {{- include "hyeboard.commonLabels" . | nindent 4 }}
  {{- with .Values.browserless.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.browserless.service.type }}
  ports:
    - name: http
      port: {{ .Values.browserless.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "hyeboard.browserlessName" . }}
    app.kubernetes.io/component: browserless
{{- end }}
