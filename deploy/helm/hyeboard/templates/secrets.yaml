{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyeboard.secretName" . }}
  labels:
    {{- include "hyeboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $runtime := .Values.secrets.runtime }}
  HYEB_SESSION_SECRET: {{ required "secrets.runtime.HYEB_SESSION_SECRET is required when secrets.create is true" $runtime.HYEB_SESSION_SECRET | quote }}
  HYEB_POSTGRES_URL: {{ required "secrets.runtime.HYEB_POSTGRES_URL is required when secrets.create is true" $runtime.HYEB_POSTGRES_URL | quote }}
  HYEB_REDIS_URL: {{ required "secrets.runtime.HYEB_REDIS_URL is required when secrets.create is true" $runtime.HYEB_REDIS_URL | quote }}
  AUTOMATION_KEY_CURRENT_ID: {{ required "secrets.runtime.AUTOMATION_KEY_CURRENT_ID is required when secrets.create is true" $runtime.AUTOMATION_KEY_CURRENT_ID | quote }}
  AUTOMATION_KEY_CURRENT_B64: {{ required "secrets.runtime.AUTOMATION_KEY_CURRENT_B64 is required when secrets.create is true" $runtime.AUTOMATION_KEY_CURRENT_B64 | quote }}
  BROWSERLESS_ENDPOINT: {{ required "secrets.runtime.BROWSERLESS_ENDPOINT is required when secrets.create is true" $runtime.BROWSERLESS_ENDPOINT | quote }}
  BROWSERLESS_TOKEN: {{ required "secrets.runtime.BROWSERLESS_TOKEN is required when secrets.create is true" $runtime.BROWSERLESS_TOKEN | quote }}
  {{- with $runtime.AUTOMATION_KEY_PREVIOUS_ID }}
  AUTOMATION_KEY_PREVIOUS_ID: {{ . | quote }}
  {{- end }}
  {{- with $runtime.AUTOMATION_KEY_PREVIOUS_B64 }}
  AUTOMATION_KEY_PREVIOUS_B64: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.redisAuth.existingSecret }}
  labels:
    {{- include "hyeboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.redisAuth.key }}: {{ required "secrets.redisAuth.password is required when secrets.create is true" .Values.secrets.redisAuth.password | quote }}
{{- end }}
