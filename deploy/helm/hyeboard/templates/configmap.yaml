apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hyeboard.fullname" . }}-runtime
  labels:
    {{- include "hyeboard.labels" . | nindent 4 }}
    {{- include "hyeboard.commonLabels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config.runtime }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- with .Values.config.extraData }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
