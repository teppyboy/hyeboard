apiVersion: v1
kind: Secret
metadata:
  name: hyeboard-runtime
  annotations:
    kubernetes.io/description: >-
      Template only. Create the real Secret with an external secret manager
      or kubectl.
type: Opaque
stringData:
  HYEB_SESSION_SECRET: replace-with-at-least-32-random-characters
  HYEB_POSTGRES_URL: >-
    postgresql://hyeboard:replace-me@postgres.example.internal:5432/hyeboard
  HYEB_REDIS_URL: rediss://redis.example.internal:6379
  AUTOMATION_KEY_CURRENT_ID: current-2026-01
  AUTOMATION_KEY_CURRENT_B64: replace-with-32-byte-base64-key
  AUTOMATION_KEY_PREVIOUS_ID: replace-with-previous-key-id-or-remove
  AUTOMATION_KEY_PREVIOUS_B64: replace-with-previous-32-byte-base64-key-or-remove
  BROWSERLESS_ENDPOINT: wss://browserless.example.internal/chromium
  BROWSERLESS_TOKEN: replace-with-browserless-token
