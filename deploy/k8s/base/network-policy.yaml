apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hyeboard-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hyeboard-api
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hyeboard-automation-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hyeboard-automation-worker
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 3000
