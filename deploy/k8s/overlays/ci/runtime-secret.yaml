apiVersion: v1
kind: Secret
metadata:
  name: hyeboard-runtime
  labels:
    app.kubernetes.io/name: hyeboard-runtime
    app.kubernetes.io/component: ci
  annotations:
    kubernetes.io/description: Disposable credentials for the isolated Kubernetes CI overlay only; never use in deployments.
type: Opaque
stringData:
  HYEB_SESSION_SECRET: ci-student-session-secret-not-for-production
  HYEB_ADMIN_SESSION_SECRET: ci-admin-session-secret-not-for-production
  HYEB_POSTGRES_URL: postgresql://hyeboard:hyeboard@postgres:5432/hyeboard
  HYEB_REDIS_URL: redis://redis:6379/0
  AUTOMATION_KEY_CURRENT_ID: ci-only
  AUTOMATION_KEY_CURRENT_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  BROWSERLESS_ENDPOINT: ws://browserless:3000/chromium
  BROWSERLESS_TOKEN: ci-browserless-token
