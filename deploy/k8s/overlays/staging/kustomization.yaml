apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hyeboard-staging
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
patches:
  - path: scaling.yaml
configMapGenerator:
  - name: hyeboard-runtime
    behavior: merge
    literals:
      - HYEB_ALLOWED_ORIGINS=https://staging.hyeboard.example.com
images:
  # Replace the explicit placeholder tags with an immutable release tag.
  - name: ghcr.io/im-yuuki/hyeboard-api
    newName: ghcr.io/im-yuuki/hyeboard-api
    newTag: replace-with-release-tag
  - name: ghcr.io/im-yuuki/hyeboard-automation-worker
    newName: ghcr.io/im-yuuki/hyeboard-automation-worker
    newTag: replace-with-release-tag
