apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hyeboard-browserless
  labels:
    app.kubernetes.io/name: hyeboard-browserless
    app.kubernetes.io/component: browserless
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hyeboard-browserless
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
