apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hyeboard-browserless
  labels:
    app.kubernetes.io/name: hyeboard-browserless
    app.kubernetes.io/component: browserless
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hyeboard-browserless
      app.kubernetes.io/component: browserless
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: automation-worker
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
